<!doctype html>
<html lang="en" class="booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4EEDD" />
    <meta name="description" content="Tonight in Prague as a deck of posters. Swipe, save, make a plan." />
    <title>Prague Tonight</title>
    <style>
      html.booting { background: #dcd6c6; }
      html.booting #shell { opacity: 0; }
      #boot-skeleton { display: none; }
      html.booting #boot-skeleton {
        position: fixed;
        inset: 0;
        width: min(480px, 100%);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #f4eedd;
      }
      #boot-skeleton, #boot-skeleton * { box-sizing: border-box; }
      .sk-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: calc(8px + env(safe-area-inset-top)) 12px 6px 16px;
        min-height: calc(50px + env(safe-area-inset-top));
        flex: none;
      }
      .sk-block { display: block; background: #d8cfb9; border-radius: 4px; }
      .sk-logo { width: 164px; height: 22px; }
      .sk-settings { width: 108px; height: 36px; border-radius: 99px; }
      .sk-deck { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 2px 10px 0; }
      .sk-frame { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
      .sk-poster {
        position: relative;
        width: min(100cqw, 100cqh * 5 / 7);
        aspect-ratio: 5 / 7;
        overflow: hidden;
        border: 1px solid #d8cfb9;
        border-radius: 12px;
        background: #e9e1cb;
        padding: 8%;
        display: flex;
        flex-direction: column;
        gap: 4%;
      }
      .sk-poster::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(100deg, transparent 20%, rgb(244 238 221 / 0.55) 50%, transparent 80%);
        transform: translateX(-100%);
        animation: sk-shimmer 1.8s linear infinite;
      }
      .sk-kicker { width: 30%; height: 3%; margin-bottom: 8%; }
      .sk-title { width: 92%; height: 10%; }
      .sk-title-short { width: 66%; }
      .sk-art { flex: 1; margin: 6% 0; border-radius: 50% 50% 4px 4px; opacity: 0.55; }
      .sk-fact { width: 72%; height: 3%; }
      .sk-fact-short { width: 48%; }
      .sk-controls { display: flex; align-items: center; justify-content: space-evenly; flex: none; width: 100%; max-width: 400px; margin: 0 auto; padding: 12px 0; }
      .sk-circle { width: 64px; height: 64px; border-radius: 50%; }
      .sk-circle-small { width: 48px; height: 48px; }
      .sk-nav { display: flex; align-items: center; justify-content: space-around; flex: none; height: calc(61.5px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); border-top: 1.5px solid #cfc7b2; }
      .sk-nav .sk-block { width: 90px; height: 16px; }
      .sk-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      @keyframes sk-shimmer { to { transform: translateX(100%); } }
      @media (max-height: 640px) { .sk-controls { padding: 8px 0; } }
      @media (prefers-reduced-motion: reduce) { .sk-poster::after { animation: none; display: none; } }
    </style>
    <script>
      setTimeout(function revealShell() {
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', revealShell, { once: true });
          return;
        }
        document.documentElement.classList.remove('booting');
        var shell = document.getElementById('shell');
        if (shell) {
          shell.inert = false;
          shell.removeAttribute('aria-hidden');
          shell.removeAttribute('aria-busy');
        }
      }, 4000);
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23FF5A3C'/%3E%3Cg stroke='%23191919' stroke-width='2.4'%3E%3Cpath d='M12 4v16M4 12h16M6.3 6.3l11.4 11.4M17.7 6.3L6.3 17.7'/%3E%3C/g%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="boot-skeleton" role="status">
      <span class="sk-status">Loading Prague Tonight…</span>
      <div class="sk-header" aria-hidden="true"><span class="sk-block sk-logo"></span><span class="sk-block sk-settings"></span></div>
      <div class="sk-deck" aria-hidden="true">
        <div class="sk-frame">
          <div class="sk-poster">
            <span class="sk-block sk-kicker"></span>
            <span class="sk-block sk-title"></span><span class="sk-block sk-title sk-title-short"></span>
            <span class="sk-block sk-art"></span>
            <span class="sk-block sk-fact"></span><span class="sk-block sk-fact sk-fact-short"></span>
          </div>
        </div>
        <div class="sk-controls"><span class="sk-block sk-circle sk-circle-small"></span><span class="sk-block sk-circle"></span><span class="sk-block sk-circle"></span><span class="sk-block sk-circle sk-circle-small"></span></div>
      </div>
      <div class="sk-nav" aria-hidden="true"><span class="sk-block"></span><span class="sk-block"></span></div>
    </div>
    <!-- Keep the stylesheet after the critical skeleton so it can paint while CSS loads. -->
    <!-- app-styles -->
    <link rel="stylesheet" href="/src/styles.css" />
    <div id="shell" inert aria-hidden="true" aria-busy="true">
      <header class="masthead">
        <button type="button" class="logo" aria-label="Prague Tonight, back to the deck">prague tonight.</button>
        <button type="button" class="settings-btn" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="settings-label">Tonight</span><span class="settings-dot" hidden></span></button>
      </header>
      <div id="banner"></div>
      <main id="main" tabindex="-1"></main>
      <nav class="bottom" aria-label="Main">
        <a href="#/" class="nav-deck"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l8 9-8 9-8-9z"/></svg> Deck</a>
        <a href="#/night" class="nav-night"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg> My Night <span class="count" aria-label="saved"></span></a>
      </nav>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
